[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="assets/radbro-survivors-dual-style-v1/**,assets/**/LICENSE.txt,assets/**/SPRITE-PERMISSION.txt,upstream/*.txt,UPSTREAM.json"
exclude_filter="assets/radbro-survivors-dual-style-v1/source/*,assets/radbro-survivors-dual-style-v1/source/**,tests/*,.local-assets/*,.local-assets/**,local-assets/*,local-assets/**,.review-assets/*,.review-assets/**,review-assets/*,review-assets/**,review-art/*,review-art/**,progress.md"
export_path="../../build/godot-radbro-survivors/index.html"
script_export_mode=2

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

html/head_include="<script>\nwindow.radbroSurvivorsReady = function () {\n  window.parent.postMessage({type:'radbro:game-ready',game:'godot-radbro-survivors',title:'Radbro Survivors',objective:'Survive all three waves for 90 seconds.',hint:'Keep moving. Collect XP and choose upgrades.',controls:['WASD / arrows / touch: move','Enter: start','P: pause','R: restart','1 / 2 / 3: upgrade','T / Style: change art','M / Sound: mute','F: fullscreen']}, '*');\n};\nwindow.radbroSurvivorsResult = function (status, score) {\n  window.parent.postMessage({type:'radbro:game-result',game:'godot-radbro-survivors',status:status,score:score}, '*');\n};\nwindow.addEventListener('message', function (event) {\n  if (event.data && event.data.type === 'radbro:game-ready-request' && typeof window.render_game_to_text === 'function') window.radbroSurvivorsReady();\n});\n</script>"
